<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Qilin Qi portrait placeholder</title>
  <desc id="desc">Initials QQ on a neutral background, not a photograph</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f5f2"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
  </defs>
  <rect width="720" height="720" rx="72" fill="url(#background)"/>
  <circle cx="360" cy="310" r="176" fill="#fff" opacity=".86"/>
  <circle cx="360" cy="310" r="184" fill="none" stroke="#0d7774" stroke-dasharray="4 18" stroke-linecap="round" stroke-width="6" opacity=".18"/>
  <text x="360" y="352" fill="#173747" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="700" letter-spacing="5" text-anchor="middle">QQ</text>
  <text x="360" y="574" fill="#173747" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">QILIN QI</text>
  <text x="360" y="634" fill="#607684" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="3" text-anchor="middle">PORTRAIT TO BE ADDED</text>
</svg>
